name: aur
# Turns packages/* into AUR packages (build/aur.sh) and, on main, pushes them to aur.archlinux.org.
# Pushing needs the AUR_SSH_PRIVATE_KEY secret (a key added to the AUR account that owns the packages)
# and the AUR_MAINTAINER variable ("Name <email>"); without the key it only checks and uploads them.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packages/**', 'iso/*.ref', 'build/aur.sh', '.github/workflows/aur.yml']
  pull_request:
    paths: ['packages/**', 'iso/*.ref', 'build/aur.sh', '.github/workflows/aur.yml']
permissions:
  contents: read
concurrency: aur
jobs:
  aur:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed git openssh
      - uses: actions/checkout@v4
      - name: Render PKGBUILDs and .SRCINFO
        env: { AUR_MAINTAINER: '${{ vars.AUR_MAINTAINER }}' }
        run: |
          useradd -m builder && chown -R builder .
          su builder -c 'git config --global --add safe.directory "*" && AUR_MAINTAINER="$AUR_MAINTAINER" build/aur.sh'
          for d in out/aur/*/; do bash -n "$d/PKGBUILD"; test -s "$d/.SRCINFO"; done
      - uses: actions/upload-artifact@v4
        with: { name: aur-packages, path: out/aur, include-hidden-files: true }
      - name: Push to the AUR
        if: github.event_name != 'pull_request'
        env: { AUR_KEY: '${{ secrets.AUR_SSH_PRIVATE_KEY }}' }
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z $AUR_KEY ]]; then echo "::notice::AUR_SSH_PRIVATE_KEY isn't set, so nothing was pushed."; exit 0; fi
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          # Trust only the AUR's published Ed25519 host key (fingerprint from https://aur.archlinux.org).
          ssh-keyscan -t ed25519 aur.archlinux.org 2>/dev/null > ~/.ssh/known_hosts
          fp=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')
          [[ $fp == SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4 ]] || { echo "unexpected AUR host key $fp"; exit 1; }
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git config --global user.name "GraceOS packages"
          git config --global user.email "noreply@github.com"
          for d in out/aur/*/; do
            pkg=$(basename "$d")
            git clone -q "ssh://aur@aur.archlinux.org/$pkg.git" "aur-$pkg"   # an empty repo for a new package
            find "aur-$pkg" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -r "$d". "aur-$pkg/"
            git -C "aur-$pkg" add -A
            if git -C "aur-$pkg" diff --cached --quiet; then echo "$pkg: up to date"; continue; fi
            git -C "aur-$pkg" commit -qm "Update to $(sed -n 's/^\s*pkgver = //p' "$d.SRCINFO")-$(sed -n 's/^\s*pkgrel = //p' "$d.SRCINFO") from GraceOS ${GITHUB_SHA::7}"
            git -C "aur-$pkg" push -q origin HEAD:master
            echo "$pkg: pushed"
          done
