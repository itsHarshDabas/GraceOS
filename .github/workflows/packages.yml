name: packages
# Builds packages/* and publishes them as the "graceos" pacman repo on the repo-x86_64 release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packages/**', 'iso/candyland.ref', 'iso/cherrysoda.ref', 'iso/cottoncandy.ref', 'build/build-packages.sh', '.github/workflows/packages.yml']
permissions:
  contents: write
concurrency: packages
jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # pkgver counts commits
      - name: Build in Arch
        run: |
          docker run --rm -v "$PWD:/src" archlinux:latest bash -euc '
            pacman -Syu --noconfirm --needed base-devel git make python
            useradd -m builder && chown -R builder /src
            su builder -c "git config --global --add safe.directory \"*\" && cd /src && build/build-packages.sh"'
      - name: Publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          tag=repo-x86_64
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --latest=false \
            --title "GraceOS package repo (x86_64)" \
            --notes "pacman repo for GraceOS's own packages. Server = https://github.com/${{ github.repository }}/releases/download/$tag"
          gh release upload "$tag" out/repo/* --clobber
          # Drop packages that this build no longer produces.
          gh release view "$tag" --json assets -q '.assets[].name' | while read -r a; do
            [ -e "out/repo/$a" ] || gh release delete-asset "$tag" "$a" -y
          done
