LABEL arch
TEXT HELP
Boot the GraceOS live medium on BIOS.
It allows you to install GraceOS or perform system maintenance.
ENDTEXT
MENU LABEL GraceOS live medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# GraceOS: basic graphics (nomodeset) for GPUs whose driver gives a black screen
LABEL archsafe
TEXT HELP
Boot the GraceOS live medium on BIOS with basic graphics (nomodeset).
Use it if the normal entry gives a black or frozen screen.
ENDTEXT
MENU LABEL GraceOS live medium (%ARCH%, BIOS), safe ^graphics
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the GraceOS live medium on BIOS with speakup screen reader.
It allows you to install GraceOS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL GraceOS live medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
