# GraceOS: no `kms` hook (upstream releng has it after modconf). It copied every GPU driver and its
# firmware into the initramfs (249 MB, and the ISO stores it twice: once for BIOS, once inside the
# UEFI boot image), which pushed the ISO past GitHub's 2 GiB release-file limit. The GPU drivers
# still load from the live system as soon as udev starts, before the desktop.
HOOKS=(base udev microcode modconf memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
