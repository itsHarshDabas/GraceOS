[project]
name = "cherrycola"
version = "0.1.0"
description = "GraceOS local model CLI (Ollama / LM Studio, stdlib only)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cherrycola = "cherrycola.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cherrycola"]

[tool.pytest.ini_options]
testpaths = ["tests"]
