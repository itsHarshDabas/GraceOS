[project]
name = "grace-model-manager"
version = "0.1.0"
description = "GraceOS model manager: GGUF metadata reader and memory estimator (task T-006)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
grace-model = "grace_model_manager.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "gguf>=0.10",
  "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grace_model_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
